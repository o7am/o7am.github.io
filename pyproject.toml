[project]
name = "o7am-website"
version = "0.1.0"
description = "Static site generator for o7.am"
requires-python = ">=3.9"
dependencies = [
    "Jinja2>=3.1",
    "PyYAML>=6.0",
]

[tool.uv]
package = false

# Cloudflare Pages auto-runs `pip install .` when it sees this file. There's no package here
# (build.py is a script), so tell setuptools not to auto-discover data/, assets/, templates/.
[tool.setuptools]
py-modules = []
packages = []
