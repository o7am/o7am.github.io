  meta:
    tagline: "o7AM: Usługi IT, Druk 3D i Inżynieria Danych"
    alice_alt: "o7AM: Usługi IT, Druk 3D i Inżynieria Danych dla Twojego biznesu"
    index_intro_1: 'W o7AM stawiamy na kreatywne podejście i nieszablonowe rozwiązania, które zmieniają sposób myślenia o technologii 3D. Dzięki szybkiemu prototypowaniu, ekologicznym metodom oraz podejściu "fast fail, fast learn" pomagamy naszym klientom realizować projekty, które są zarówno innowacyjne, jak i efektywne.'
    index_intro_2: "Naszym celem jest dostarczanie produktów i usług, które nie tylko odpowiadają na unikalne potrzeby naszych klientów, ale także wyprzedzają ich oczekiwania."
    home_title: "o7AM |> IT | 3D | Data"
