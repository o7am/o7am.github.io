    alice_alt: "o7AM: IT, 3D & Data Engineering for your business"
    index_intro_1: 'At o7AM we focus on a creative approach and unconventional solutions that change how people think about 3D technology. With rapid prototyping, sustainable methods and a "fast fail, fast learn" mindset we help our clients deliver projects that are both innovative and effective.'
    index_intro_2: "Our goal is to deliver products and services that not only meet our clients' unique needs but also exceed their expectations."
