    contact_description: "Get in touch with o7AM. Radzyń, Greater Poland. 3D printing, Data Engineering, ML."
  services:
    heading: "Our services for your business"
    it_title: "IT Support | o7AM"
    it_short: "IT Support"
    it_teaser: "Technical support, setup, system maintenance"
    it_description: "IT support at o7AM: home networks, NAS servers, data recovery help, workstation setup and maintenance."
    it_cta: "Technical support, workstation and network setup, system maintenance. Remote and on-site support, flexible engagement."
    it_heading: "General IT support for business"
    it_body: "We offer IT support for small and medium businesses: workstation and network setup, system maintenance, remote and on-site help, deployments and consulting. Flexible engagement to match your needs."
    it_engagements_heading: "Example engagements"
    it_engagements: |
      <ul>
        <li>Local home network setup for several households — connecting devices and delivering stable internet access throughout the building.</li>
        <li>NAS (network-attached storage) setup and configuration — centralized file storage and automated backups.</li>
        <li>Data recovery support — retrieving important files or regaining access, depending on what's technically possible in each case.</li>
        <li>Workstation setup and ongoing maintenance, keeping computers running reliably day to day.</li>
      </ul>
    3d_title: "Custom 3D Printing | o7AM"
    3d_short: "Custom 3D Printing"
    3d_teaser: "Custom projects, high quality, fast turnaround"
    3d_description: "Custom 3D printing at o7AM: rapid prototyping, replacement parts, small-batch branded items, QR/NFC prints. See what we can help with."
    3d_cta: "We offer professional 3D printing to order, tailored to your needs. High quality and on-time delivery."
    3d_heading: "Why choose custom 3D printing"
    3d_body: "We offer 3D printing services that enable custom projects tailored to our clients' needs. Using modern technology we can create complex models, prototypes, spare parts and unique products. High-quality materials, expert support at every stage and a flexible approach to design. With us you can deliver even the most ambitious projects."
    3d_engagements_heading: "What we can help with"
    3d_engagements: |
      <ul>
        <li>Durable QR-code and NFC-embedded prints — physical tags, plaques or signage with a working QR code or embedded NFC chip, for interactive marketing or asset tracking.</li>
        <li>Rapid, AI-assisted prototyping — from idea to physical proof-of-concept fast, then iterate together with you in a print-test-refine cycle ("fast fail, fast learn").</li>
        <li>Replacement parts for hard-to-find or discontinued items — including reconstruction via 3D scanning or remodeling from measurements or photos when no original file exists.</li>
        <li>On-demand promotional and marketing items in small batches, no large minimum order — see our <a href="/en/portfolios/3d_prints.html">branded V60-2 Hario filter holder</a> as a real example.</li>
        <li>Bring your own file (STL/STEP) — or just an idea — and we'll quote it individually (a self-service pricing tool is on our roadmap).</li>
        <li>Custom jigs and fixtures for workshops and other small businesses — purpose-built tools that make manual work faster and more consistent.</li>
        <li>Multi-color and multi-material printing (MMU), plus carbon-fiber-reinforced filament for parts that need more strength than standard PLA.</li>
        <li>Eco-conscious materials where possible, in line with our sustainable, iterative approach to design.</li>
      </ul>
    de_title: "Data Engineering | o7AM"
    de_short: "Data Engineering"
    de_teaser: "ELT/ETL, Spark, Trino, Flink"
    de_description: "Data Engineering at o7AM: Airflow migrations, Debezium CDC, Iceberg tables on S3, Superset dashboards. See our example engagements."
    de_cta: "We specialize in data processing and data engineering, offering solutions tailored to your business needs."
    de_heading: "Data Engineering services"
    de_body: "We specialize in delivering Data Engineering solutions: design and build of data pipelines (Spark, Flink, Airflow), ETL/ELT, Big Data, cloud services (AWS, GCP, Kubernetes, Terraform). Solutions tailored to your business and technology context. We also provide ongoing, ad-hoc support for data teams — from pipeline debugging to fast-turnaround changes in ETL/ELT logic. Get in touch to find out how we can support your business growth."
    de_engagements_heading: "Example engagements"
    de_engagements: |
      <ul>
        <li>Apache Airflow 2 → 3 orchestration migration for a healthtech booking platform's production data pipelines — upgrading DAGs and custom operators with zero disruption to daily and hourly data loads.</li>
        <li>Kafka + Debezium change-data-capture pipelines feeding a Redshift data warehouse in near real time, replacing slower batch-only ingestion.</li>
        <li>Apache Iceberg tables built directly on raw S3 as an analytics-ready storage layer, queried by engines like Amazon Athena — no separate data-warehouse ETL hop required.</li>
        <li>A dashboard promotion process for Apache Superset across dev/staging/production environments, enabling safe, self-service reporting company-wide.</li>
        <li>Migrated real-time stream processing from Apache Storm to Apache Flink on AWS for a media/publishing company, including integration testing with Localstack and Docker.</li>
        <li>Consolidated data from heterogeneous sources (XML, Excel, SQL, web) into a single analytics tool for a market-research company's executive team.</li>
      </ul>
