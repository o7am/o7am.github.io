    services_description: "Druk 3D na zamówienie oraz Data Engineering. Rozwiązania dopasowane do Twojego biznesu."
    contact_title: "Kontakt | o7AM"
    contact_description: "Skontaktuj się z o7AM. Radzyń, Wielkopolska. Druk 3D, Data Engineering, ML."
  services:
    heading: "Nasze usługi dla Twojego biznesu"
    it_title: "Wsparcie IT | o7AM"
    it_short: "Wsparcie IT"
    it_teaser: "Pomoc techniczna, konfiguracja, utrzymanie systemów"
    it_description: "Wsparcie IT w o7AM: sieci domowe, serwery NAS, odzyskiwanie danych, konfiguracja i utrzymanie komputerów."
    it_cta: "Pomoc techniczna, konfiguracja stanowisk i sieci, utrzymanie systemów. Wsparcie zdalne i na miejscu, elastyczne formy współpracy."
    it_heading: "Ogólne wsparcie IT dla firm"
    it_body: "Oferujemy wsparcie informatyczne dla małych i średnich firm: konfiguracja stanowisk i sieci, utrzymanie systemów, pomoc zdalna i na miejscu, wdrożenia oraz doradztwo. Elastyczne formy współpracy dopasowane do Twoich potrzeb."
    it_engagements_heading: "Przykładowe realizacje"
    it_engagements: |
      <ul>
        <li>Konfiguracja lokalnej sieci domowej dla kilku gospodarstw domowych — połączenie urządzeń i stabilny dostęp do internetu w całym budynku.</li>
        <li>Instalacja i konfiguracja serwera NAS — scentralizowane przechowywanie plików i automatyczne kopie zapasowe.</li>
        <li>Pomoc w odzyskiwaniu danych — odzyskiwanie ważnych plików lub dostępu, w zależności od możliwości i okoliczności danej sprawy.</li>
        <li>Konfiguracja i bieżące utrzymanie komputerów oraz stanowisk pracy, tak aby działały niezawodnie na co dzień.</li>
      </ul>
    3d_title: "Druk 3D na zamówienie | o7AM"
    3d_short: "Druk 3D na zamówienie"
    3d_teaser: "Indywidualne projekty, wysoka jakość, szybki czas realizacji"
    3d_description: "Druk 3D na zamówienie w o7AM: szybkie prototypowanie, części zamienne, gadżety reklamowe w małych seriach, druki z QR/NFC. Zobacz, w czym możemy pomóc."
    3d_cta: "Oferujemy profesjonalne drukowanie elementów 3D na zamówienie, dostosowane do indywidualnych potrzeb klienta. Wysoka jakość i terminowość."
    3d_heading: "Dlaczego warto skorzystać z druku 3D na zamówienie"
    3d_body: "Oferujemy usługi druku 3D, które pozwalają na realizację indywidualnych projektów dostosowanych do potrzeb naszych klientów. Dzięki nowoczesnej technologii możemy tworzyć skomplikowane modele, prototypy, części zamienne oraz unikalne produkty. Wysoka jakość materiałów, wsparcie ekspertów na każdym etapie i elastyczne podejście do projektowania. Z nami możesz zrealizować nawet najbardziej ambitne projekty."
    3d_engagements_heading: "W czym możemy pomóc"
    3d_engagements: |
      <ul>
        <li>Trwałe wydruki z kodami QR lub wbudowanymi tagami NFC — fizyczne oznaczenia, plakietki czy szyldy z działającym kodem QR lub chipem NFC, do interaktywnego marketingu lub oznaczania sprzętu.</li>
        <li>Szybkie prototypowanie wspomagane AI — od pomysłu do fizycznego PoC w krótkim czasie, a potem wspólna iteracja z Tobą w cyklu "drukuj - testuj - popraw" (fast fail, fast learn).</li>
        <li>Części zamienne do trudno dostępnych lub wycofanych z produkcji elementów — w tym odwzorowanie przez skanowanie 3D lub na podstawie pomiarów czy zdjęć, gdy nie ma oryginalnego pliku.</li>
        <li>Gadżety reklamowe i marketingowe drukowane na żądanie w małych seriach, bez dużego minimum zamówienia — zobacz nasz <a href="/portfolios/3d_prints.html">brandowany uchwyt na filtry V60-2 Hario</a> jako realny przykład.</li>
        <li>Wyślij swój plik (STL/STEP) lub po prostu pomysł — wycenimy go indywidualnie (docelowo planujemy też narzędzie do samoobsługowej wyceny).</li>
        <li>Niestandardowe uchwyty i przyrządy warsztatowe dla innych małych firm i twórców — narzędzia szyte na miarę, które przyspieszają i ułatwiają ręczną pracę.</li>
        <li>Druk wielokolorowy i wielomateriałowy (MMU) oraz filament wzmacniany włóknem węglowym dla elementów wymagających większej wytrzymałości niż standardowe PLA.</li>
        <li>Materiały przyjazne środowisku tam, gdzie to możliwe — zgodnie z naszym zrównoważonym, iteracyjnym podejściem do projektowania.</li>
      </ul>
    de_title: "Data Engineering | o7AM"
    de_short: "Data Engineering"
    de_teaser: "ELT/ETL, Spark, Trino, Flink"
    de_description: "Data Engineering w o7AM: migracje Airflow, CDC z Debezium, tabele Iceberg na S3, dashboardy Superset. Zobacz nasze przykładowe realizacje."
    de_cta: "Specjalizujemy się w kompleksowym przetwarzaniu danych oraz inżynierii danych, oferując rozwiązania dopasowane do specyficznych potrzeb biznesowych."
    de_heading: "Usługi z zakresu Data Engineeringu"
    de_body: "Specjalizujemy się w dostarczaniu rozwiązań z zakresu Data Engineeringu: projektowanie i budowa potoków danych (Spark, Flink, Airflow), ETL/ELT, Big Data, usługi chmurowe (AWS, GCP, Kubernetes, Terraform). Rozwiązania dopasowane do kontekstu biznesowego i technologicznego. Zapewniamy też bieżące, doraźne wsparcie zespołów danych — od debugowania pipeline'ów po szybkie zmiany w logice ETL/ELT na życzenie. Skontaktuj się z nami, aby dowiedzieć się, jak możemy wspierać rozwój Twojego biznesu."
    de_engagements_heading: "Przykładowe realizacje"
    de_engagements: |
      <ul>
        <li>Migracja orkiestracji Apache Airflow z wersji 2 do 3 dla platformy rezerwacyjnej z branży healthtech — aktualizacja DAG-ów i customowych operatorów bez przerw w codziennych i cogodzinnych ładowaniach danych.</li>
        <li>Wdrożenie przechwytywania zmian danych (CDC) z użyciem Kafki i Debezium, zasilające hurtownię Redshift niemal w czasie rzeczywistym — w miejsce wolniejszego ładowania wyłącznie wsadowego.</li>
        <li>Budowa warstwy tabel Apache Iceberg bezpośrednio na surowym S3 jako gotowego do analiz storage'u, odpytywanego przez silniki takie jak Amazon Athena, bez dodatkowego etapu ETL do osobnej hurtowni.</li>
        <li>Zaprojektowanie procesu promocji dashboardów Apache Superset pomiędzy środowiskami (dev/staging/produkcja), umożliwiającego bezpieczne, samoobsługowe raportowanie w całej organizacji.</li>
        <li>Migracja przetwarzania strumieniowego z Apache Storm do Apache Flink na AWS dla firmy z branży wydawniczej/mediowej, wraz z testami integracyjnymi opartymi o Localstack i Docker.</li>
        <li>Konsolidacja danych z niejednorodnych źródeł (XML, Excel, SQL, web) w jednym narzędziu analitycznym dla kadry zarządzającej firmy badawczej.</li>
      </ul>
